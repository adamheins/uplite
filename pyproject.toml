[project]
authors = [{name = "Adam Heins", email = "mail@adamheins.com"}]
dependencies = ["pybullet>=3.2.7,<4", "pyb-utils>=2.4.2,<3"]
name = "uplite"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
uplite = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
numpy = ">=2.4.0,<3"
casadi = ">=3.7.0,<4"
pinocchio = ">=3.8.0,<4"
matplotlib = ">=3.10.8,<4"
pip = ">=25.3,<26"
scipy = ">=1.16.3,<2"
